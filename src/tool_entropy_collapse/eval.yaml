title: "Tool-Entropy Collapse: WANDERING Failure-Mode Detection"
description: |
  Monitoring eval for the WANDERING agent failure mode. Given pre-recorded multi-turn
  agent trajectories (Qwen3.6-27B on SWE-bench Pro, N=99) with gold WANDERING/SUCCESS/LOCKED
  labels, applies one of four WANDERING detectors (v1 post-hoc text, v4 cross-layer probe
  disagreement, v5 tool-entropy collapse, v1∪v5 ensemble) and scores recall, false-positive
  rate, and lead-turns.

  Trajectories are pre-recorded — no model is invoked at eval time. This is a "monitoring
  eval" rather than a "capability eval": the subject under test is the detector function,
  not the agent.

