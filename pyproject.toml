[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tool_entropy_collapse*"]

[tool.setuptools.package-data]
"*" = ["eval.yaml"]

[project]
name = "inspect-tool-entropy-collapse"
description = "Inspect AI eval for WANDERING failure-mode detection in agent trajectories (Tool-Entropy Collapse signature)"
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version"]
readme = "README.md"
authors = [
    {name = "Caio Vicentino", email = "caio@openinterp.org"},
]
keywords = ["mechanistic-interpretability", "agent-safety", "swe-bench", "failure-detection", "wandering"]
dependencies = [
    "inspect_ai>=0.3.158",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/OpenInterpretability/inspect-tool-entropy-collapse"
Dataset = "https://huggingface.co/datasets/caiovicentino1/swebench-pro-qwen36-27b-phase6"
Paper = "https://zenodo.org/records/20368601"

[project.entry-points.inspect_ai]
tool_entropy_collapse = "tool_entropy_collapse"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
